name: fav_app
description: 藏星 - 本地优先的内容收藏与间隔复习工具
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  dio: ^5.7.0
  html: ^0.15.5
  flutter_markdown: ^0.7.4+2
  markdown: ^7.2.2
  share_handler: ^0.0.25
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  uuid: ^4.5.1
  intl: ^0.19.0
  file_picker: ^8.1.7
  flutter_secure_storage: ^10.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  mailer: ^6.3.0
  add_2_calendar: ^3.0.2
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  file_picker:
    path: third_party/file_picker

flutter:
  uses-material-design: true
  assets:
    - assets/extract/trigger_lazy_scroll.js
    - assets/extract/trigger_lazy_swiper.js
    - assets/extract/trigger_lazy_dots.js
    - assets/extract/trigger_lazy_dom.js
    - assets/extract/has_content.js
    - assets/extract/extract.js
