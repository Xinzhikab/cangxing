name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 重命名 APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "cangxing-v${{ steps.ver.outputs.version }}+${{ github.run_number }}.apk"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}+${{ github.run_number }}
          name: 藏星 v${{ steps.ver.outputs.version }}
          body: |
            自动构建（commit ${{ github.sha }}）

            > 版本号取自 pubspec.yaml，构建号为 Actions 运行序号。
            > APK 使用 debug 签名，可直接安装升级。
          files: cangxing-v${{ steps.ver.outputs.version }}+${{ github.run_number }}.apk
          generate_release_notes: true
